name: Apply Trojan zh-CN

on:
  push:
    branches:
      - docs/trojan-wire-depth

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: docs/trojan-wire-depth
          fetch-depth: 0

      - name: Install gettext
        uses: ./.github/workflows/apt-get-install
        with:
          packages: gettext

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install minimal mdBook toolchain
        run: |
          cargo binstall mdbook --version 0.4.52 --locked -y
          cargo binstall mdbook-i18n-helpers --version 0.3.6 --locked -y
          cargo binstall mdbook-mermaid --version 0.16.0 --locked -y
          cargo binstall mdbook-svgbob --version 0.2.2 --locked -y
          cargo install --path mdbook-course --locked
          cargo install --path mdbook-exerciser --locked

      - name: Install PO helper
        run: python -m pip install --disable-pip-version-check polib

      - name: Refresh catalog
        run: scripts/update-zh.sh --stats

      - name: Apply Trojan translations
        shell: python
        run: |
          import polib
          import sys

          translations = {
              "Clients may send payload immediately after the request header, but TLS record and TCP segment boundaries are not Trojan message boundaries.": "客户端可以在请求头之后立即发送载荷，但 TLS 记录和 TCP 分段的边界并不是 Trojan 消息边界。",
              "This chapter describes the byte stream seen by a Trojan implementation after the outer transport is established. The normative protocol shape comes from the Trojan specification; implementation-specific limits are called out separately.": "本章描述外层传输建立后 Trojan 实现所看到的字节流。规范性的协议结构以 Trojan 规范为准；实现特有的限制会单独标明。",
              "The client first opens a TCP connection to the Trojan server and performs a normal TLS handshake.": "客户端首先与 Trojan 服务端建立 TCP 连接，然后执行标准 TLS 握手。",
              "The client is responsible for validating the server certificate and hostname unless certificate verification has been deliberately disabled.": "除非明确禁用了证书验证，否则客户端负责验证服务端证书和主机名。",
              "If the TLS handshake fails, the connection terminates before any Trojan request is exchanged.": "如果 TLS 握手失败，连接会在交换任何 Trojan 请求之前终止。",
              "TLS records are **transport framing, not Trojan message framing**. A Trojan header may be split across several TLS records, and a TLS record may contain the end of the header plus application payload. Parsers must therefore consume the decrypted TLS connection as an ordered byte stream rather than assume one `read()` equals one protocol message.": "TLS 记录是**传输层分帧，而不是 Trojan 消息分帧**。一个 Trojan 请求头可能跨越多个 TLS 记录，一个 TLS 记录也可能同时包含请求头尾部和应用载荷。因此解析器必须把解密后的 TLS 连接视为有序字节流来消费，不能假定一次 `read()` 就对应一条协议消息。",
              "After TLS is established, the client sends:": "TLS 建立后，客户端发送：",
              "The authentication field is 56 ASCII hexadecimal characters representing the 28-byte SHA-224 digest of the configured password. The current Chimera client emits lowercase hexadecimal. It is immediately followed by `CRLF`; there is no separate authentication negotiation or success packet.": "认证字段由 56 个 ASCII 十六进制字符组成，表示配置密码的 28 字节 SHA-224 摘要。当前 Chimera 客户端输出小写十六进制。其后紧跟 `CRLF`；不存在独立的认证协商或认证成功响应包。",
              "The optional `Payload` is only meaningful after the request header has been accepted. For `CONNECT`, it is the first bytes for the destination TCP stream. Sending it together with the header is an optimization, not a different protocol state.": "可选的 `Payload` 只有在请求头被接受后才有意义。对于 `CONNECT`，它是发往目标 TCP 字节流的首批数据。把它与请求头一起发送只是减少交互次数的优化，并不代表不同的协议状态。",
              "For a request with no initial payload, the encoded header sizes are:": "对于不携带初始载荷的请求，编码后的请求头长度如下：",
              "Destination type": "目标类型",
              "Trojan Request size": "Trojan Request 长度",
              "Full initial header size": "完整初始请求头长度",
              "Domain of `N` bytes": "`N` 字节域名",
              "The full size includes the 56-byte password digest text and both `CRLF` delimiters.": "完整长度包括 56 字节密码摘要文本以及两处 `CRLF` 分隔符。",
              "Trojan Request deliberately keeps the SOCKS5 command and address vocabulary while removing the SOCKS5 version and reserved fields:": "Trojan Request 有意保留 SOCKS5 的命令和地址字段语义，同时移除了 SOCKS5 的版本字段和保留字段：",
              "`CMD` is one byte:": "`CMD` 为 1 字节：",
              "Value": "值",
              "`CONNECT`: establish a TCP connection to the destination": "`CONNECT`：与目标建立 TCP 连接",
              "`UDP ASSOCIATE`: carry UDP datagrams as frames inside this Trojan stream": "`UDP ASSOCIATE`：在该 Trojan 字节流内以帧形式承载 UDP 数据报",
              "`ATYP` and `DST.ADDR` use the SOCKS5 address encoding:": "`ATYP` 和 `DST.ADDR` 使用 SOCKS5 地址编码：",
              "Address": "地址",
              "Encoded `DST.ADDR`": "编码后的 `DST.ADDR`",
              "exactly 4 address bytes": "恰好 4 字节地址数据",
              "domain name": "域名",
              "1-byte length `N`, followed by `N` domain bytes": "1 字节长度 `N`，随后是 `N` 字节域名数据",
              "exactly 16 address bytes": "恰好 16 字节地址数据",
              "`DST.PORT` is an unsigned 16-bit port in network byte order (big-endian). A domain length is therefore limited by the one-byte length field to at most 255 bytes on the wire.": "`DST.PORT` 是按网络字节序（大端）编码的无符号 16 位端口。因此在线路格式中，域名长度受 1 字节长度字段限制，最多为 255 字节。",
              "The request is terminated by another `CRLF`. A receiver must not treat bytes after this delimiter as more request fields: they are either TCP payload (`CONNECT`) or the start of the UDP frame stream (`UDP ASSOCIATE`).": "请求以另一处 `CRLF` 结束。接收端不得把该分隔符之后的字节继续当作请求字段：这些字节要么是 TCP 载荷（`CONNECT`），要么是 UDP 帧流的起始部分（`UDP ASSOCIATE`）。",
              "Full Client/Server Exchange": "客户端/服务端完整交互",
              "A normal connection can be modeled as the following sequence:": "一次正常连接可以建模为以下顺序：",
              "**TCP connect.** The client creates a TCP connection to the Trojan endpoint.": "**TCP 连接。** 客户端与 Trojan 端点建立 TCP 连接。",
              "**TLS handshake.** Client and server negotiate TLS; the client normally verifies the server identity.": "**TLS 握手。** 客户端与服务端协商 TLS；通常由客户端验证服务端身份。",
              "**Authentication and command.** The client writes the 56-byte digest text, `CRLF`, `CMD`, encoded destination, and the terminating `CRLF`. For `CONNECT`, first application bytes may follow immediately.": "**认证与命令。** 客户端依次写入 56 字节摘要文本、`CRLF`、`CMD`、编码后的目标地址以及结尾 `CRLF`。对于 `CONNECT`，首批应用数据可以紧随其后。",
              "**Authentication check.** The server reads the digest line and compares it with configured users. In the current Chimera server this comparison is constant-time.": "**认证检查。** 服务端读取摘要行并与已配置用户进行比较。当前 Chimera 服务端使用常量时间比较。",
              "**Command/address parse.** The server validates `CMD`, `ATYP`, address bytes, port, and the terminating `CRLF`.": "**命令/地址解析。** 服务端校验 `CMD`、`ATYP`、地址字节、端口以及结尾 `CRLF`。",
              "**Branch by command.** `CONNECT` causes an outbound TCP connect; `UDP ASSOCIATE` enters the UDP frame loop.": "**按命令分支。** `CONNECT` 触发对目标的 TCP 出站连接；`UDP ASSOCIATE` 进入 UDP 帧循环。",
              "**Relay.** TCP bytes are copied bidirectionally, or UDP frames are decoded/encoded repeatedly on the same TLS stream.": "**转发。** TCP 字节进行双向复制；或者在同一 TLS 字节流上持续解码和编码 UDP 帧。",
              "**Close.** EOF, TLS/TCP failure, an unrecoverable parse error, or policy failure terminates the relay. Invalid initial traffic may instead enter a configured fallback path.": "**关闭。** EOF、TLS/TCP 故障、不可恢复的解析错误或策略失败都会终止转发。无效的初始流量也可能改为进入已配置的回落路径。",
              "A notable property is the absence of a Trojan-level success response. Once a `CONNECT` request succeeds, the first bytes received from the server side are destination application bytes, not a `REP` packet. This differs materially from SOCKS5.": "一个重要特性是 Trojan 协议层没有成功响应。`CONNECT` 请求成功后，客户端从服务端方向收到的第一批字节是目标应用数据，而不是 `REP` 响应包。这与 SOCKS5 存在实质差异。",
              "Server Responses: What Is Not on the Wire": "服务端响应：线路上不存在的内容",
              "Trojan does **not** define equivalents of several SOCKS5 server messages:": "Trojan **没有**定义下列 SOCKS5 服务端消息的等价物：",
              "no method-selection response;": "没有认证方法选择响应；",
              "no RFC 1929 authentication-status response;": "没有 RFC 1929 认证状态响应；",
              "no `VER | REP | RSV | BND.ADDR | BND.PORT` command reply;": "没有 `VER | REP | RSV | BND.ADDR | BND.PORT` 命令响应；",
              "no structured Trojan error code corresponding to SOCKS5 `REP` values such as network unreachable or connection refused.": "没有与 SOCKS5 `REP` 值（例如网络不可达、连接被拒绝）对应的结构化 Trojan 错误码。",
              "Consequently, a client generally observes success by the tunnel becoming usable. A failure before relay is represented by connection termination, TLS failure, implementation-specific behavior, or fallback handling rather than a portable Trojan error frame.": "因此，客户端通常通过隧道开始可用来判断成功。转发开始前的失败表现为连接终止、TLS 失败、实现特有行为或回落处理，而不是可移植的 Trojan 错误帧。",
              "The current Chimera server follows this model: its Trojan `CONNECT` path returns no protocol-level connection-success bytes before forwarding destination data.": "当前 Chimera 服务端遵循这一模型：其 Trojan `CONNECT` 路径在开始转发目标数据之前不会返回协议层的连接成功字节。",
              "TCP Relay": "TCP 转发",
              "After a successful `CONNECT`, the Trojan layer adds no further framing:": "`CONNECT` 成功后，Trojan 层不再增加额外分帧：",
              "There is no Trojan-native stream identifier, sequence number, fragment header, multiplexing frame, window-update command, or per-message acknowledgement. Ordering, retransmission, congestion control, and transport backpressure are supplied by the underlying TCP connection; confidentiality and integrity are supplied by TLS.": "Trojan 原生协议中没有流标识符、序列号、分片头、多路复用帧、窗口更新命令或逐消息确认。排序、重传、拥塞控制和传输背压由底层 TCP 连接提供；机密性和完整性由 TLS 提供。",
              "A plain Trojan connection therefore represents one `CONNECT` tunnel or one UDP association. Multiplexing, WebSocket wrapping, or another transport layer may be added by particular products, but those are additional layers rather than fields in the base Trojan protocol.": "因此，一个基础 Trojan 连接只表示一个 `CONNECT` 隧道或一个 UDP 关联。某些产品可以额外加入多路复用、WebSocket 封装或其他传输层，但这些属于附加层，而不是基础 Trojan 协议字段。",
              "When `CMD` is `UDP ASSOCIATE`, each UDP datagram is serialized in the TLS stream as:": "当 `CMD` 为 `UDP ASSOCIATE` 时，每个 UDP 数据报在 TLS 字节流中序列化为：",
              "The address encoding is identical to the request address encoding above.": "地址编码与上面的请求地址编码完全相同。",
              "`Length` is the UDP payload length as an unsigned 16-bit value in network byte order.": "`Length` 是按网络字节序编码的无符号 16 位 UDP 载荷长度。",
              "`Payload` is exactly `Length` bytes of UDP payload.": "`Payload` 恰好包含 `Length` 字节的 UDP 载荷。",
              "Frames are bidirectional. Client-to-server frames name the destination endpoint; server-to-client frames carry the endpoint associated with the received UDP datagram.": "帧是双向的。客户端到服务端的帧给出目标端点；服务端到客户端的帧携带与所接收 UDP 数据报关联的端点。",
              "There is no SOCKS5 `RSV` or `FRAG` field and no Trojan-native fragmentation/reassembly mechanism.": "这里没有 SOCKS5 的 `RSV` 或 `FRAG` 字段，也没有 Trojan 原生的分片/重组机制。",
              "Header overhead before each UDP payload is 11 bytes for IPv4, 23 bytes for IPv6, and `N + 8` bytes for an `N`\\-byte domain name.": "每个 UDP 载荷之前的请求头开销：IPv4 为 11 字节，IPv6 为 23 字节，`N` 字节域名为 `N + 8` 字节。",
              "Header overhead before each UDP payload is 11 bytes for IPv4, 23 bytes for IPv6, and `N + 8` bytes for an `N`-byte domain name.": "每个 UDP 载荷之前的请求头开销：IPv4 为 11 字节，IPv6 为 23 字节，`N` 字节域名为 `N + 8` 字节。",
              "Although `Length` can represent values through 65535, implementation limits may be smaller. The current Chimera server rejects Trojan UDP payloads larger than 8192 bytes in either direction. This is a **Chimera implementation limit**, not a new field in the Trojan protocol.": "虽然 `Length` 可以表示最大 65535 的值，但具体实现的限制可能更小。当前 Chimera 服务端会拒绝任一方向上超过 8192 字节的 Trojan UDP 载荷。这是**Chimera 实现限制**，并不是 Trojan 协议中新增加的字段。",
              "Because these UDP frames are serialized over a reliable TCP/TLS byte stream, packet loss at the TCP layer can delay later UDP frames behind retransmission. This head-of-line behavior is fundamentally different from SOCKS5 UDP relay, where application datagrams normally travel over UDP after the association is established.": "由于这些 UDP 帧被串行化到可靠的 TCP/TLS 字节流中，TCP 层发生丢包时，后续 UDP 帧会被重传阻塞。这种队头阻塞行为与 SOCKS5 UDP 转发有根本区别：SOCKS5 在关联建立后，应用数据报通常通过 UDP 传输。",
              "State Machines": "状态机",
              "A useful client-side state machine is:": "一个实用的客户端状态机如下：",
              "A server-side state machine is:": "服务端状态机如下：",
              "The exact fallback transition is implementation-dependent. The official Trojan design treats invalid initial Trojan traffic as another protocol so it can be forwarded to a normal service; an implementation may impose stricter parsing or close on errors that occur after it has already committed to Trojan processing.": "具体的回落状态转换取决于实现。Trojan 官方设计会把无效的初始 Trojan 流量视为其他协议，从而转发到正常服务；实现也可以采用更严格的解析规则，或者在已经确认进入 Trojan 处理流程后遇到错误时直接关闭连接。",
              "SOCKS5 Stage-by-Stage Mapping": "与 SOCKS5 的逐阶段映射",
              "The closest comparison is standard SOCKS5 from RFC 1928, with RFC 1929 as the common username/password authentication method:": "最直接的比较对象是 RFC 1928 定义的标准 SOCKS5，并以 RFC 1929 作为常见的用户名/密码认证方法：",
              "Stage": "阶段",
              "SOCKS5 (RFC 1928/1929)": "SOCKS5（RFC 1928/1929）",
              "Relationship": "对应关系",
              "Transport connection": "传输连接",
              "TCP connection to the SOCKS server": "与 SOCKS 服务端建立 TCP 连接",
              "TCP connection followed by TLS": "TCP 连接后再建立 TLS",
              "**Extra layer:** Trojan adds TLS before proxy protocol bytes": "**额外层：** Trojan 在代理协议字节之前增加 TLS",
              "Method negotiation": "认证方法协商",
              "`VER, NMETHODS, METHODS` → `VER, METHOD`": "`VER, NMETHODS, METHODS` → `VER, METHOD`",
              "none": "无",
              "**Removed:** Trojan has no method-selection phase": "**已移除：** Trojan 没有认证方法选择阶段",
              "Optional method-specific subnegotiation; RFC 1929 sends username/password and receives `STATUS`": "可选的认证方法专属子协商；RFC 1929 发送用户名/密码并接收 `STATUS`",
              "fixed 56-byte `hex(SHA224(password))` prefix + `CRLF`; no auth reply": "固定的 56 字节 `hex(SHA224(password))` 前缀 + `CRLF`；无认证响应",
              "**Replaced**": "**已替换**",
              "Proxy request": "代理请求",
              "`VER, CMD, RSV, ATYP, DST.ADDR, DST.PORT`": "`VER, CMD, RSV, ATYP, DST.ADDR, DST.PORT`",
              "`CMD, ATYP, DST.ADDR, DST.PORT`": "`CMD, ATYP, DST.ADDR, DST.PORT`",
              "**Same concepts, reduced header:** `VER` and `RSV` disappear": "**概念相同、请求头精简：** `VER` 和 `RSV` 被移除",
              "Address types": "地址类型",
              "IPv4, domain with one-byte length, IPv6": "IPv4、带 1 字节长度的域名、IPv6",
              "same encodings and ATYP values": "编码方式和 ATYP 值相同",
              "**Same concept and wire encoding**": "**概念和线路编码均相同**",
              "Command success/failure": "命令成功/失败",
              "Server sends `REP` and `BND.ADDR/BND.PORT`": "服务端发送 `REP` 和 `BND.ADDR/BND.PORT`",
              "no standardized command reply": "没有标准化命令响应",
              "**Removed/replaced by tunnel outcome**": "**已移除/由隧道结果替代**",
              "TCP forwarding": "TCP 转发",
              "raw application stream after successful reply": "成功响应后的原始应用字节流",
              "raw application stream after accepted request, protected by TLS": "请求被接受后的原始应用字节流，由 TLS 保护",
              "**Same relay concept + TLS outer layer**": "**转发概念相同 + TLS 外层**",
              "UDP association setup": "UDP 关联建立",
              "TCP control request returns a UDP relay address": "TCP 控制请求返回 UDP 转发地址",
              "same TLS/TCP connection becomes a UDP frame stream": "同一 TLS/TCP 连接转为 UDP 帧流",
              "**Replaced transport model**": "**传输模型已替换**",
              "UDP packet header": "UDP 数据包头",
              "`RSV(2), FRAG, ATYP, DST.ADDR, DST.PORT, DATA`": "`RSV(2), FRAG, ATYP, DST.ADDR, DST.PORT, DATA`",
              "`ATYP, DST.ADDR, DST.PORT, Length, CRLF, Payload`": "`ATYP, DST.ADDR, DST.PORT, Length, CRLF, Payload`",
              "**Replaced framing:** no `RSV`/`FRAG`; adds explicit length + delimiter": "**分帧已替换：** 无 `RSV`/`FRAG`；增加显式长度和分隔符",
              "RFC 1928 defines `FRAG` semantics": "RFC 1928 定义了 `FRAG` 语义",
              "no Trojan-native fragmentation field": "没有 Trojan 原生分片字段",
              "**Removed**": "**已移除**",
              "Multiplexing / flow control": "多路复用 / 流量控制",
              "not provided by base SOCKS5": "基础 SOCKS5 不提供",
              "not provided by base Trojan": "基础 Trojan 不提供",
              "**Same absence at proxy layer;** Trojan inherits TCP flow/congestion behavior": "**代理层同样不存在；** Trojan 继承 TCP 的流量/拥塞行为",
              "Error reporting": "错误报告",
              "structured `REP` values": "结构化 `REP` 值",
              "close, TLS/I/O failure, fallback, or implementation-specific behavior": "关闭连接、TLS/I/O 失败、回落或实现特有行为",
              "The important implementation lesson is that “SOCKS5-like” applies to Trojan's **command and address encoding**, not to the complete SOCKS5 session state machine.": "实现时最重要的一点是，“类似 SOCKS5”只适用于 Trojan 的**命令和地址编码**，并不意味着完整的 SOCKS5 会话状态机相同。",
              "Packet-Capture View": "抓包视角",
              "Without TLS session keys, a packet capture normally exposes only the outer layers:": "没有 TLS 会话密钥时，抓包通常只能看到外层信息：",
              "TCP three-way handshake to the Trojan server.": "与 Trojan 服务端之间的 TCP 三次握手。",
              "TLS `ClientHello` and the rest of the TLS handshake. Depending on TLS version and configuration, metadata such as SNI or ALPN may be observable.": "TLS `ClientHello` 及后续 TLS 握手。根据 TLS 版本和配置，SNI、ALPN 等元数据可能仍可观察。",
              "Encrypted TLS application-data records in both directions.": "双向加密的 TLS Application Data 记录。",
              "TCP FIN/RST or TLS close behavior when the connection ends.": "连接结束时的 TCP FIN/RST 或 TLS 关闭行为。",
              "The Trojan password digest, command, destination address, UDP lengths, and proxied payload are inside TLS and are not visible as plaintext to a passive capture that cannot decrypt the session.": "Trojan 密码摘要、命令、目标地址、UDP 长度以及被代理的载荷都位于 TLS 内部；无法解密会话的被动抓包看不到这些明文。",
              "With TLS keys, a debugging TLS terminator, or instrumentation immediately above TLS, the first decrypted client bytes have a recognizable layout:": "如果拥有 TLS 密钥、使用调试用 TLS 终止器，或在 TLS 上方直接插桩，则可以识别客户端解密后首批字节的布局：",
              "For `CONNECT`, all following plaintext bytes belong to the destination byte stream. For `UDP ASSOCIATE`, the parser repeatedly returns to `ATYP` and decodes address → port → length → `CRLF` → payload.": "对于 `CONNECT`，之后的所有明文字节都属于目标字节流。对于 `UDP ASSOCIATE`，解析器会反复回到 `ATYP` 状态，并按地址 → 端口 → 长度 → `CRLF` → 载荷的顺序解码。",
              "Do not infer protocol-message boundaries from TCP segments or TLS records. Segmentation, coalescing, retransmission, and buffering can make the same logical Trojan header appear in many different packet layouts.": "不要根据 TCP 分段或 TLS 记录推断协议消息边界。分段、合并、重传和缓冲都可能让同一个逻辑 Trojan 请求头在抓包中呈现出多种不同布局。",
              "Boundary Conditions and Current Chimera Behavior": "边界条件与当前 Chimera 行为",
              "The following checks are especially useful when implementing or reviewing a parser:": "实现或审查解析器时，以下检查尤其重要：",
              "Condition": "条件",
              "Wire meaning": "线路语义",
              "Current Chimera behavior": "当前 Chimera 行为",
              "Authentication field": "认证字段",
              "56 hexadecimal ASCII bytes before `CRLF`": "`CRLF` 前的 56 个十六进制 ASCII 字节",
              "Server hashes configured passwords with SHA-224, expects a 56-byte hex digest, and uses constant-time comparison; password-line parsing is bounded": "服务端对配置密码计算 SHA-224，期望收到 56 字节十六进制摘要，并使用常量时间比较；密码行解析有长度上限",
              "Unsupported `CMD`": "不支持的 `CMD`",
              "Not a valid base Trojan command": "不是有效的基础 Trojan 命令",
              "rejected; only `0x01` and `0x03` are accepted": "拒绝；仅接受 `0x01` 和 `0x03`",
              "Unknown `ATYP`": "未知 `ATYP`",
              "Address cannot be decoded": "地址无法解码",
              "rejected": "拒绝",
              "Domain length `0`": "域名长度为 `0`",
              "Empty domain encoding": "空域名编码",
              "server rejects it": "服务端拒绝",
              "Domain bytes": "域名字节",
              "Length-prefixed opaque field in SOCKS-style encoding": "SOCKS 风格编码中的长度前缀不透明字段",
              "current server/client parsers require valid UTF-8 when converting to their domain type": "当前服务端/客户端解析器在转换为内部域名类型时要求有效 UTF-8",
              "Port": "端口",
              "2-byte unsigned integer": "2 字节无符号整数",
              "decoded as big-endian/network byte order": "按大端/网络字节序解码",
              "Missing/bad request `CRLF`": "请求 `CRLF` 缺失/错误",
              "Header terminator invalid": "请求头终止符无效",
              "UDP `Length`": "UDP `Length`",
              "current server additionally limits payload to 8192 bytes": "当前服务端额外将载荷限制为 8192 字节",
              "Bad UDP frame `CRLF`": "UDP 帧 `CRLF` 错误",
              "Frame boundary invalid": "帧边界无效",
              "UDP relay parser terminates/errors": "UDP 转发解析器终止/报错",
              "Header split across reads": "请求头跨多次读取",
              "Normal stream behavior": "正常的字节流行为",
              "parser must continue reading until each required field is complete": "解析器必须持续读取，直到每个必需字段完整",
              "When documenting interoperability, distinguish constraints imposed by the official wire format from limits imposed by one implementation. For example, the 8192-byte UDP limit is present in `Chimera_Server`, while the on-wire `Length` field itself is 16 bits.": "说明互操作性时，应区分官方线路格式规定的约束和单个实现施加的限制。例如，8192 字节 UDP 上限来自 `Chimera_Server`，而线路上的 `Length` 字段本身是 16 位。",
              "Connection Closure and Error Handling": "连接关闭与错误处理",
              "Base Trojan has no dedicated close command. The lifetime is the lifetime of the TLS/TCP stream:": "基础 Trojan 没有专用关闭命令。其连接生命周期就是 TLS/TCP 字节流的生命周期：",
              "a clean EOF from either side ends the corresponding relay direction and eventually the connection;": "任一侧的正常 EOF 会结束对应的转发方向，并最终结束连接；",
              "TLS alerts, TCP reset, upstream connect errors, or local I/O errors terminate the tunnel;": "TLS alert、TCP reset、上游连接错误或本地 I/O 错误会终止隧道；",
              "malformed authentication/request data cannot be reported with a portable Trojan error frame because no such frame is defined;": "格式错误的认证/请求数据无法通过可移植的 Trojan 错误帧报告，因为协议没有定义这种帧；",
              "invalid initial traffic may be sent to a configured fallback service, preserving the appearance of an ordinary TLS endpoint;": "无效的初始流量可以被发送到已配置的回落服务，以维持普通 TLS 端点的外观；",
              "a malformed UDP frame causes loss of framing synchronization, so implementations should fail the association rather than guess at the next boundary.": "格式错误的 UDP 帧会导致分帧同步丢失，因此实现应终止该关联，而不是猜测下一个帧边界。",
              "Half-close behavior is ultimately transport/implementation dependent. Implementations should preserve TCP EOF semantics where practical and avoid interpreting an ordinary application EOF as a Trojan command.": "半关闭行为最终取决于传输层和具体实现。实现应尽可能保留 TCP EOF 语义，并避免把普通应用 EOF 解释为 Trojan 命令。",
              "Security Notes": "安全注意事项",
              "The SHA-224 value is a deterministic password-derived identifier, **not a password-hardening KDF**. Use high-entropy, unique Trojan passwords; do not rely on SHA-224 alone to make weak passwords resistant to offline guessing if a digest is disclosed.": "SHA-224 值是确定性的密码派生标识，**不是用于增强密码强度的 KDF**。应使用高熵且唯一的 Trojan 密码；如果摘要泄露，不要指望仅靠 SHA-224 就能让弱密码抵抗离线猜测。",
              "TLS is the confidentiality and integrity boundary for the Trojan header and payload. Certificate/hostname verification on the client is therefore security-critical unless trust is established by another explicit mechanism.": "TLS 是 Trojan 请求头和载荷的机密性与完整性边界。因此，除非通过其他明确机制建立信任，否则客户端的证书/主机名验证至关重要。",
              "Base Trojan defines no additional per-request nonce or anti-replay field; replay protection and channel freshness come from the TLS session rather than the Trojan header.": "基础 Trojan 没有定义额外的逐请求 nonce 或防重放字段；重放防护和通道新鲜性来自 TLS 会话，而不是 Trojan 请求头。",
              "TLS hides Trojan fields but does not automatically hide all traffic metadata. Endpoint IPs, timing, sizes, and some handshake metadata can remain observable.": "TLS 会隐藏 Trojan 字段，但不会自动隐藏所有流量元数据。端点 IP、时序、大小以及部分握手元数据仍可能被观察到。",
              "Fallback destinations should be intentionally controlled. Pointing fallback traffic at sensitive internal or administrative services can turn probing behavior into unwanted access to those services.": "应明确控制回落目标。把回落流量指向敏感的内部服务或管理服务，可能使探测流量变成对这些服务的非预期访问。",
              "Parsers should bound line lengths and UDP frame lengths before allocating buffers, reject impossible address lengths early, and compare credentials without data-dependent early exits.": "解析器应在分配缓冲区之前限制行长度和 UDP 帧长度，尽早拒绝不可能的地址长度，并在比较凭据时避免依赖数据内容的提前退出。",
              "Implementation Notes": "实现说明",
              "The current Chimera implementations used to cross-check this chapter are:": "用于交叉核对本章的当前 Chimera 实现包括：",
              "client request construction: `Chimera_Client/clash-lib/src/proxy/trojan/mod.rs`;": "客户端请求构造：`Chimera_Client/clash-lib/src/proxy/trojan/mod.rs`；",
              "client UDP frame encoder/decoder and read state machine: `Chimera_Client/clash-lib/src/proxy/trojan/datagram.rs`;": "客户端 UDP 帧编码器/解码器及读取状态机：`Chimera_Client/clash-lib/src/proxy/trojan/datagram.rs`；",
              "server authentication/request parser: `Chimera_Server/chimera_server_lib/src/handler/trojan.rs`;": "服务端认证/请求解析器：`Chimera_Server/chimera_server_lib/src/handler/trojan.rs`；",
              "server UDP frame parser/encoder: `Chimera_Server/chimera_server_lib/src/handler/trojan_udp.rs`.": "服务端 UDP 帧解析器/编码器：`Chimera_Server/chimera_server_lib/src/handler/trojan_udp.rs`。",
              "These implementation notes describe current project behavior and should not be mistaken for additional normative Trojan fields.": "这些实现说明描述的是当前项目行为，不应被误认为额外的规范性 Trojan 字段。",
              "Trojan protocol specification: https://trojan-gfw.github.io/trojan/protocol.html": "Trojan 协议规范：https://trojan-gfw.github.io/trojan/protocol.html",
              "SOCKS Protocol Version 5 (RFC 1928): https://datatracker.ietf.org/doc/html/rfc1928": "SOCKS 协议版本 5（RFC 1928）：https://datatracker.ietf.org/doc/html/rfc1928",
              "Username/Password Authentication for SOCKS V5 (RFC 1929): https://datatracker.ietf.org/doc/html/rfc1929": "SOCKS V5 用户名/密码认证（RFC 1929）：https://datatracker.ietf.org/doc/html/rfc1929",
          }

          passthrough = {
              "IPv4", "IPv6", "8 bytes", "68 bytes", "20 bytes", "80 bytes",
              "`N + 5` bytes", "`N + 65` bytes", "ATYP", "`0x01`", "`0x03`", "`0x04`",
          }

          po = polib.pofile("po/zh-CN.po")
          targets = {"src/protocols/trojan.md", "src/protocols/trojan/wire-format.md"}
          unresolved = []
          changed = 0
          for entry in po:
              paths = {path for path, _line in entry.occurrences}
              if not (paths & targets):
                  continue
              if entry.msgstr and "fuzzy" not in entry.flags:
                  continue
              if entry.msgid in translations:
                  entry.msgstr = translations[entry.msgid]
              elif entry.msgid in passthrough:
                  entry.msgstr = entry.msgid
              else:
                  unresolved.append(entry.msgid)
                  continue
              entry.flags = [flag for flag in entry.flags if flag != "fuzzy"]
              changed += 1

          if unresolved:
              print("Unresolved Trojan msgids:")
              for msgid in unresolved:
                  print(repr(msgid))
              sys.exit(1)

          po.save("po/zh-CN.po")
          print(f"Translated {changed} Trojan entries")

      - name: Validate and require complete Trojan translation
        run: |
          msgfmt --check --output-file=/dev/null po/zh-CN.po
          python - <<'PY'
          import polib
          import sys
          po = polib.pofile('po/zh-CN.po')
          targets = {'src/protocols/trojan.md', 'src/protocols/trojan/wire-format.md'}
          missing = []
          for entry in po:
              paths = {path for path, _line in entry.occurrences}
              if paths & targets and (not entry.msgstr or 'fuzzy' in entry.flags):
                  missing.append(entry.msgid)
          if missing:
              print('Remaining Trojan translation gaps:')
              for msgid in missing:
                  print(repr(msgid))
              sys.exit(1)
          print('Trojan zh-CN entries are complete and non-fuzzy.')
          PY

      - name: Commit translation
        run: |
          if git diff --quiet -- po/zh-CN.po; then
            echo 'No PO changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add po/zh-CN.po
          git commit -m 'docs: translate Trojan wire protocol to zh-CN'
          git push origin HEAD:docs/trojan-wire-depth
