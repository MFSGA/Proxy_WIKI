name: Fast Refresh Trojan zh-CN

on:
  push:
    branches:
      - docs/trojan-wire-depth

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: docs/trojan-wire-depth
          fetch-depth: 0

      - name: Install gettext
        uses: ./.github/workflows/apt-get-install
        with:
          packages: gettext

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install minimal mdBook toolchain
        run: |
          cargo binstall mdbook --version 0.4.52 --locked -y
          cargo binstall mdbook-i18n-helpers --version 0.3.6 --locked -y
          cargo binstall mdbook-mermaid --version 0.16.0 --locked -y
          cargo binstall mdbook-svgbob --version 0.2.2 --locked -y
          cargo install --path mdbook-course --locked
          cargo install --path mdbook-exerciser --locked

      - name: Install PO helper
        run: python -m pip install --disable-pip-version-check polib

      - name: Refresh catalog
        run: scripts/update-zh.sh --stats

      - name: Print missing Trojan translation entries
        shell: python
        run: |
          import polib
          import sys

          po = polib.pofile('po/zh-CN.po')
          targets = {
              'src/protocols/trojan.md',
              'src/protocols/trojan/wire-format.md',
          }
          missing = []
          for entry in po:
              paths = {path for path, _line in entry.occurrences}
              if paths & targets and (not entry.msgstr or 'fuzzy' in entry.flags):
                  missing.append(entry)

          print('=== TROJAN_TRANSLATION_MISSING ===')
          for entry in missing:
              print(repr(entry.msgid))
          print('=== END_TROJAN_TRANSLATION_MISSING ===')
          if missing:
              sys.exit(1)
