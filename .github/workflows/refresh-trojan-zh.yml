name: Refresh Trojan zh-CN

on:
  push:
    branches:
      - docs/trojan-wire-depth

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gettext
        uses: ./.github/workflows/apt-get-install
        with:
          packages: gettext

      - name: Install mdBook toolchain
        uses: ./.github/workflows/install-mdbook

      - name: Install PO helper
        run: python -m pip install --disable-pip-version-check polib

      - name: Refresh catalog
        run: scripts/update-zh.sh --stats

      - name: Require complete Trojan translation
        shell: python
        run: |
          import polib
          import sys

          po = polib.pofile('po/zh-CN.po')
          targets = {
              'src/protocols/trojan.md',
              'src/protocols/trojan/wire-format.md',
          }
          missing = []
          for entry in po:
              paths = {path for path, _line in entry.occurrences}
              if paths & targets and (not entry.msgstr or 'fuzzy' in entry.flags):
                  missing.append(entry)

          if missing:
              print('=== TROJAN_TRANSLATION_MISSING ===')
              for entry in missing:
                  print(repr(entry.msgid))
              print('=== END_TROJAN_TRANSLATION_MISSING ===')
              sys.exit(1)

      - name: Commit refreshed translation
        run: |
          if git diff --quiet -- po/zh-CN.po; then
            echo 'No translation changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add po/zh-CN.po
          git commit -m 'docs: refresh zh-CN Trojan translations'
          git push
