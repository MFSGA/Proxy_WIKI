[book]
title = "Proxy Wiki"
authors = ["chimera_rust@proton.me"]
language = "en"
multilingual = true
src = "src"

[rust]
edition = "2024"

[build]
extra-watch-dirs = ["po", "third_party"]

[preprocessor.gettext]
after = ["links"]

[preprocessor.svgbob]
renderers = ["html"]
after = ["gettext"]
class = "bob"

[preprocessor.course]
verbose = false # Report timing information.

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.xgettext]
optional = true
pot-file = "messages.pot"
granularity = 0

[output.pandoc]
optional = true
disabled = true
hosted-html = "https://mfsga.github.io/Proxy_WIKI/"

[output.pandoc.profile.pdf]
output-file = "proxy-wiki.pdf"
pdf-engine = "lualatex"

[output.pandoc.profile.pdf.variables]
mainfont = "Noto Serif"
sansfont = "Noto Sans"
monofont = "Noto Sans Mono"
mainfontfallback = [
  "NotoColorEmoji:mode=harf",
  "NotoNaskhArabic:",
]
sansfontfallback = [
  "NotoSansArabic:",
]
monofontfallback = [
  "NotoColorEmoji:mode=harf",
  "NotoSansMath:",
  "NotoSansMonoCJKSC:",
  "NotoSansArabic:",
]
geometry = ["margin=1.25in"]
linkcolor = "blue"
urlcolor = "red"

[output.html]
smart-punctuation = true
additional-js = [
  "theme/speaker-notes.js",
  "theme/redbox.js",
  "mermaid.min.js",
  "mermaid-init.js",
]
additional-css = [
  "theme/css/svgbob.css",
  "theme/css/redbox.css",
  "theme/css/speaker-notes.css",
  "theme/css/language-picker.css",
  "theme/css/rtl.css",
]
# note
site-url = "/"
git-repository-url = "https://github.com/MFSGA/Proxy_WIKI"
edit-url-template = "https://github.com/MFSGA/Proxy_WIKI/edit/main/{path}"

[output.html.fold]
enable = true
level = 0

[output.html.playground]
editable = true
line-numbers = true

[output.html.search]
use-boolean-and = true

[output.html.redirect]

[output.exerciser]
output-directory = "proxy-wiki-exercises"

[output.linkcheck]
optional = true
follow-web-links = false # change to true to check web links
exclude = [
  "proxy-wiki.pdf",
  "proxy-wiki-exercises.zip",
  # "crates.io", # uncomment when follow-web-links is true
]

[output.linkcheck2]
optional = true
follow-web-links = false # change to true to check web links
exclude = [
  "proxy-wiki.pdf",
  "proxy-wiki-exercises.zip",
  # "crates.io", # uncomment when follow-web-links is true
]
